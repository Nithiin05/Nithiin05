<svg viewBox="0 0 1160 640" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="1144" height="624" rx="20" fill="#0a0e17" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- ===== COLUMN 1 ===== -->
  <!-- Category: Data Analysis & BI -->
  <text x="55" y="70" fill="#22d3ee" font-size="19" font-weight="bold">&gt;_ DATA ANALYSIS &amp; BI</text>
  <text x="55" y="90" fill="#a855f7" font-size="11" letter-spacing="1">CORE ANALYTICS PIPELINE</text>

  <text x="55" y="130" fill="#ffffff" font-size="15" font-weight="bold">Python, Pandas &amp; NumPy</text>
  <text x="330" y="130" fill="#9ca3af" font-size="12" font-style="italic">(EDA, Data Cleaning)</text>
  <rect x="55" y="140" width="460" height="8" rx="4" fill="#1e2530"/>
  <rect x="55" y="140" width="0" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="414" dur="1.6s" begin="0.1s" fill="freeze"/>
  </rect>
  <text x="525" y="147" fill="#22d3ee" font-size="12" font-weight="bold">90%</text>

  <text x="55" y="180" fill="#ffffff" font-size="15" font-weight="bold">SQL</text>
  <text x="330" y="180" fill="#9ca3af" font-size="12" font-style="italic">(Joins, CTEs, Window Fns)</text>
  <rect x="55" y="190" width="460" height="8" rx="4" fill="#1e2530"/>
  <rect x="55" y="190" width="0" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="391" dur="1.6s" begin="0.25s" fill="freeze"/>
  </rect>
  <text x="525" y="197" fill="#22d3ee" font-size="12" font-weight="bold">85%</text>

  <text x="55" y="230" fill="#ffffff" font-size="15" font-weight="bold">Power BI</text>
  <text x="330" y="230" fill="#9ca3af" font-size="12" font-style="italic">(DAX, Power Query)</text>
  <rect x="55" y="240" width="460" height="8" rx="4" fill="#1e2530"/>
  <rect x="55" y="240" width="0" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="391" dur="1.6s" begin="0.4s" fill="freeze"/>
  </rect>
  <text x="525" y="247" fill="#22d3ee" font-size="12" font-weight="bold">85%</text>

  <!-- Category: Computer Vision -->
  <text x="55" y="330" fill="#22d3ee" font-size="19" font-weight="bold">&gt;_ COMPUTER VISION</text>
  <text x="55" y="350" fill="#a855f7" font-size="11" letter-spacing="1">PERCEPTUAL MODULES (LEARNING)</text>

  <text x="55" y="390" fill="#ffffff" font-size="15" font-weight="bold">OpenCV &amp; CNN</text>
  <text x="330" y="390" fill="#9ca3af" font-size="12" font-style="italic">(Image Processing)</text>
  <rect x="55" y="400" width="460" height="8" rx="4" fill="#1e2530"/>
  <rect x="55" y="400" width="0" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="207" dur="1.6s" begin="0.55s" fill="freeze"/>
  </rect>
  <text x="525" y="407" fill="#22d3ee" font-size="12" font-weight="bold">45%</text>

  <!-- ===== COLUMN 2 ===== -->
  <!-- Category: Machine Learning Core -->
  <text x="615" y="70" fill="#22d3ee" font-size="19" font-weight="bold">&gt;_ MACHINE LEARNING CORE</text>
  <text x="615" y="90" fill="#a855f7" font-size="11" letter-spacing="1">PREDICTIVE MODELING</text>

  <text x="615" y="130" fill="#ffffff" font-size="15" font-weight="bold">Scikit-learn</text>
  <text x="890" y="130" fill="#9ca3af" font-size="12" font-style="italic">(Reg, Class, Ensembles)</text>
