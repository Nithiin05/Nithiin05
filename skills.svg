  <text x="615" y="180" fill="#ffffff" font-size="15" font-weight="bold">Statistical Inference</text>
  <text x="890" y="180" fill="#9ca3af" font-size="12" font-style="italic">(Hypothesis, ANOVA)</text>
  <rect x="615" y="190" width="460" height="8" rx="4" fill="#1e2530"/>
  <rect x="615" y="190" width="0" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="368" dur="1.6s" begin="0.3s" fill="freeze"/>
  </rect>
  <text x="1085" y="197" fill="#22d3ee" font-size="12" font-weight="bold">80%</text>

  <text x="615" y="230" fill="#ffffff" font-size="15" font-weight="bold">Clustering &amp; PCA</text>
  <text x="890" y="230" fill="#9ca3af" font-size="12" font-style="italic">(Unsupervised)</text>
  <rect x="615" y="240" width="460" height="8" rx="4" fill="#1e2530"/>
  <rect x="615" y="240" width="0" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="345" dur="1.6s" begin="0.45s" fill="freeze"/>
  </rect>
  <text x="1085" y="247" fill="#22d3ee" font-size="12" font-weight="bold">75%</text>

  <!-- Category: Generative AI & NLP -->
  <text x="615" y="330" fill="#22d3ee" font-size="19" font-weight="bold">&gt;_ GENERATIVE AI &amp; NLP</text>
  <text x="615" y="350" fill="#a855f7" font-size="11" letter-spacing="1">LLM &amp; LANGUAGE PIPELINES (LEARNING)</text>

  <text x="615" y="390" fill="#ffffff" font-size="15" font-weight="bold">TensorFlow / Keras</text>
  <text x="890" y="390" fill="#9ca3af" font-size="12" font-style="italic">(Neural Nets)</text>
  <rect x="615" y="400" width="460" height="8" rx="4" fill="#1e2530"/>
  <rect x="615" y="400" width="0" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="253" dur="1.6s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="1085" y="407" fill="#22d3ee" font-size="12" font-weight="bold">55%</text>

  <text x="615" y="440" fill="#ffffff" font-size="15" font-weight="bold">NLP &amp; LangChain</text>
  <text x="890" y="440" fill="#9ca3af" font-size="12" font-style="italic">(Transformers, Prompting)</text>
  <rect x="615" y="450" width="460" height="8" rx="4" fill="#1e2530"/>
  <rect x="615" y="450" width="0" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="230" dur="1.6s" begin="0.75s" fill="freeze"/>
  </rect>
  <text x="1085" y="457" fill="#22d3ee" font-size="12" font-weight="bold">50%</text>

  <!-- Footer status line -->
  <text x="55" y="600" fill="#4b5563" font-size="11">&gt;_ status: actively training on advanced modules // last sync: 2026</text>
</svg>
